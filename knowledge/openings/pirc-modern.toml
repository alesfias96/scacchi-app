title = "Difesa Pirc e Difesa Moderna"
when = [
  "opening:Pirc Defense",
  "opening:Modern Defense",
]
summary = "1.e4 d6 (Pirc) o 1.e4 g6 (Moderna): il Nero lascia il centro al Bianco per attaccarlo dopo, con l'alfiere in g7. È una strategia «ipermoderna»."
ideas = [
  "Il Bianco prende il centro con d4 ed e4 (a volte anche f4).",
  "Il Nero attacca il centro con …c5 o …e5 dopo essersi sviluppato.",
  "L'alfiere in g7 è il pezzo chiave del Nero.",
]
mistakes = [
  "Per il Nero: aspettare troppo prima di attaccare il centro.",
  "Per il Bianco: avanzare i pedoni centrali senza il sostegno dei pezzi.",
]

[[plans]]
for = "white"
steps = [
  "Costruisci un centro forte (d4, e4, a volte f4).",
  "Sviluppa e prepara l'attacco (Ae3, Dd2, Ah6 per cambiare l'alfiere in g7).",
  "Non lasciare che il centro venga attaccato senza risposta.",
]

[[plans]]
for = "black"
steps = [
  "Sviluppati con …Cf6, …Ag7 e l'arrocco.",
  "Attacca il centro con …c5 o …e5.",
  "Cerca controgioco sull'ala di donna con …a6 e …b5.",
]
