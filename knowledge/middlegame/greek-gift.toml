for = "owner"
label = "Chi sacrifica"
steps = [
  "Controlla che il cavallo avversario non possa difendere da f6 e che l'alfiere avversario non copra h7.",
  "Calcola le tre risposte del re dopo la presa in h7.",
  "Sacrifica solo se in ogni caso arrivi almeno a riprendere il materiale con attacco.",
]
