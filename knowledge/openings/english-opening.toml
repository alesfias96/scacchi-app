for = "white"
steps = [
  "Fianchetta l'alfiere in g2 e controlla d5.",
  "Gioca sull'ala di donna (Tb1, b4–b5).",
  "Scegli il momento giusto per d4.",
]

[[plans]]
for = "black"
steps = [
  "Prendi spazio al centro con …e5 o …d5.",
