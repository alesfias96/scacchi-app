  "Il gioco è spesso posizionale, con spazio sull'ala di donna (b4, b5).",
]
mistakes = [
  "Per il Nero: dimenticare la forza dell'alfiere bianco in g2.",
  "Per il Bianco: giocare troppo lentamente, lasciando al Nero il centro.",
]

