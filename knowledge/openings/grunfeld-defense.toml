]
summary = "1.d4 Cf6 2.c4 g6 3.Cc3 d5: il Nero colpisce subito il centro. Dopo il cambio in d5 il Bianco ottiene un grande centro, che il Nero attacca con pezzi e pedoni."
ideas = [
  "Nella variante di cambio il Bianco ha pedoni in c3, d4 ed e4; il Nero li attacca con …c5, …Ag7 e …Cc6.",
  "L'alfiere in g7 punta diritto su d4.",
  "Il Bianco cerca la spinta d5 o l'attacco al re; il Nero cerca pressione e un finale migliore.",
]
mistakes = [
  "Per il Nero: lasciare il centro bianco senza pressione.",
  "Per il Bianco: avanzare il centro perdendo il controllo di d4.",
]

