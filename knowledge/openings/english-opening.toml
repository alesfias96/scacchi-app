]
summary = "1.c4: il Bianco controlla d5 dal lato. È un'apertura flessibile, che può trasformarsi in molte altre."
ideas = [
  "Il Bianco fianchetta spesso l'alfiere in g2, per controllare la grande diagonale e le case chiare del centro.",
